services:
  database:
    build:
      context: ./server/database
    ports:
      - "3030:3030"
  sentiment:
    build:
      context: ./server/djangoapp/microservices
    ports:
      - "5050:5050"
  web:
    build:
      context: ./server
    environment:
      backend_url: http://database:3030
      sentiment_analyzer_url: http://sentiment:5050
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - database
      - sentiment

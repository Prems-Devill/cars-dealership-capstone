{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a Review</title><link rel="stylesheet" href="/static/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css">
<style>body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;color:#1f2937}header{background:#111827;color:white;padding:18px 5%}header a{color:white;margin-right:14px}main{max-width:760px;margin:28px auto;padding:0 18px}.panel{background:white;border-radius:12px;padding:24px;box-shadow:0 3px 12px #00000012}form{display:grid;gap:10px}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}button,.button{background:#1d4ed8;color:white;border:0;padding:11px 14px;border-radius:6px;cursor:pointer;text-decoration:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.message{margin-top:12px}</style></head>
<body><header><a href="/">Home</a><a href="/dealer/{{ dealer.id }}/">Dealer Details</a><span style="float:right">Logged in as: {{ username }}</span></header><main><section class="panel">
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
{% if dealer %}<h1>Post a Review — {{ dealer.full_name }}</h1>
<form id="review-form" data-username="{{ username }}">
<label for="review">Review</label><textarea id="review" name="review" rows="4" required placeholder="Share your experience"></textarea>
<label for="purchase-date">Purchase date</label><input id="purchase-date" name="purchase_date" type="date" required>
<label for="car-make">Car make</label><input id="car-make" name="car_make" type="text" required placeholder="e.g. Toyota">
<label for="car-model">Car model</label><input id="car-model" name="car_model" type="text" required placeholder="e.g. Camry">
<label for="car-year">Car year</label><input id="car-year" name="car_year" type="number" min="1900" max="2100" required>
<label><input name="purchase" type="checkbox" checked style="width:auto"> I purchased a vehicle from this dealer</label>
<div class="actions"><button type="button" id="analyze">Analyze sentiment</button><button type="submit">Submit Review</button></div>
<p id="sentiment" aria-live="polite"></p><p id="message" class="message" role="status"></p>
</form>{% endif %}</section></main>
<script>
const form=document.getElementById("review-form"),msg=document.getElementById("message"),sent=document.getElementById("sentiment");
let sentiment="neutral";
document.getElementById("analyze")?.addEventListener("click",async()=>{const text=form.elements.review.value.trim();if(!text){msg.textContent="Enter a review first.";return;}try{const r=await fetch("/analyze/"+encodeURIComponent(text));const d=await r.json();if(!r.ok)throw new Error(d.error||"Analysis failed");sentiment=d.sentiment;sent.innerHTML='<img width="32" height="32" style="width:32px;height:32px;object-fit:contain;vertical-align:middle" alt="'+sentiment+' sentiment" src="/static/sentiment_'+sentiment+'.svg"> Sentiment: '+sentiment;msg.textContent="";}catch(e){msg.textContent=e.message||"Sentiment service unavailable";}});
form?.addEventListener("submit",async(event)=>{event.preventDefault();msg.textContent="";const fd=new FormData(form);const payload={name:form.dataset.username || "Guest",dealership:{{ dealer.id }},review:fd.get("review"),purchase:fd.get("purchase")==="on",purchase_date:fd.get("purchase_date"),car_make:fd.get("car_make"),car_model:fd.get("car_model"),car_year:Number(fd.get("car_year"))};try{const r=await fetch("/djangoapp/add_review",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not submit review");msg.textContent="Review submitted successfully.";setTimeout(()=>location.href="/dealer/{{ dealer.id }}/",600);}catch(e){msg.textContent=e.message||"Could not submit review";}});
</script></body></html>
